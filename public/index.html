<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Baseflix</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body>

    
<header class="header">

    <div class="baseflix-logo" id="baseflixLogo" style="cursor: pointer;">

        🎬 Baseflix

    </div>


    <div
        id="activeProfile"
        class="active-profile"
    >

        <span
            id="activeProfileAvatar"
            class="active-profile-avatar"
        ></span>


        <span
            id="activeProfileName"
            class="active-profile-name"
        ></span>

    </div>


    <button
        id="settingsButton"
        class="settings-button"
        title="Settings"
    >&#9881;</button>

</header>




    <main class="content">
	
	<!-- ======================================================
             ACTIVE PROFILE DATA
             ====================================================== -->

        <div
            id="profileData"
            data-profile-id=""
        ></div>


        <h2>My Videos</h2>


        <div class="video-grid">

            <!--
                Videos will be added here
                automatically by app.js.
            -->

        </div>

    </main>


    <script src="/app.js"></script>

</body>

</html>
